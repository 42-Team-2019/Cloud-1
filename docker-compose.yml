networks:
  cloud1:
    driver: bridge
    name: cloud1
services:
  # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  #                    MARIADB                          #
  # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  database:
    networks:
      - cloud1
    image: mariadb:latest
    container_name: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
    expose:
      - 3306
    volumes:
      - "./srcs/db/mariadb/:/var/lib/mysql"
  # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  #                    WORDPRESS                        #
  # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  wordpress:
    image: wordpress:php7.4-fpm
    container_name: wordpress
    environment:
      WORDPRESS_DB_HOST: not_used   # Pas de connexion à une base de données pour le moment
    volumes:
      - "./srcs/sites/wp/:/wp/"
    restart: always

  # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  #                    NGINX                            #
  # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  nginx:
    image: nginx:latest
    container_name: my-nginx
    restart: always
    ports:
      - "443:443"
    env_file:
      - ./.nginxEnv
    volumes:
      - ./src/proxy/nginx/conf:/etc/nginx/templates
      - ./src/proxy/nginx/ssl:/etc/nginx/ssl
    networks:
      - cloud1

